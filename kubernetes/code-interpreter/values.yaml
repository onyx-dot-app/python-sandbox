# Default values for code-interpreter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: onyxdotapp/code-interpreter
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}
  # NodePort configuration (when type is NodePort)
  # nodePort: 30000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: code-interpreter.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: code-interpreter-tls
  #    hosts:
  #      - code-interpreter.local

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Code Interpreter specific configuration
codeInterpreter:
  # Execution limits
  maxExecTimeoutMs: 60000
  maxOutputBytes: "1000000"
  cpuTimeLimitSec: 5
  memoryLimitMb: 256

  # API server configuration
  host: "0.0.0.0"
  port: 8000

  # Kubernetes executor configuration
  kubernetesExecutor:
    namespace: ""  # Empty means use the same namespace as the service
    # Empty means onyxdotapp/python-executor-sci with no tag (":latest"). Pin a
    # published tag, e.g. "onyxdotapp/python-executor-sci:0.4.7", for
    # reproducible installs and to avoid a registry round trip per execution.
    image: ""
    # Pull policy for execution pods: Always, IfNotPresent or Never. Empty
    # follows Kubernetes: Always for an untagged or ":latest" image, otherwise
    # IfNotPresent.
    imagePullPolicy: ""
    # Seconds to wait for an execution pod to reach Running, including the image
    # pull (1-600). Image pull errors fail the request at once.
    readyTimeoutSec: 30
    serviceAccount: ""  # Empty means use default service account for pods
    # When true, executor pods run a privileged init container that uses the
    # NET_ADMIN capability to apply iptables rules dropping all outbound traffic
    # before the executor starts — an OS-level lockdown that avoids the race
    # where a pod can reach the network before the CNI enforces a NetworkPolicy.
    # Set to false in environments whose CNI applies NetworkPolicies without that
    # race (or that disallow the NET_ADMIN capability).
    #
    # When this is false, the always-applied executor/session NetworkPolicy
    # (templates/networkpolicy.yaml) becomes the sole network restriction on
    # executor pods, so it must be enforced by the cluster CNI to have effect.
    netAdminLockdown: true
    # When true, executor and session pods carry an ownerReference to this
    # chart's Deployment. Kubernetes then garbage-collects pods that the service
    # leaks (for example after an OOM kill), and monitoring can tell these
    # short-lived pods apart from long-lived workloads.
    #
    # This grants the service "get" on apps/deployments. It has no effect when
    # kubernetesExecutor.namespace names a different namespace than the service,
    # because Kubernetes does not honour ownerReferences across namespaces.
    setOwnerReferences: true
    # Security context of execution pods. Pods always run with seccomp
    # RuntimeDefault, no service account token and all capabilities dropped.
    securityContext:
      # "fixed" runs execution pods as the IDs below. "platform" omits them, so
      # the platform assigns them (OpenShift restricted-v2). Platform mode needs
      # netAdminLockdown: false, because the lockdown container runs as root.
      mode: fixed
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      # User code can write only to /workspace and /tmp when this is true.
      readOnlyRootFilesystem: true
    # Requests and limits of the execution container. Supported: cpu, memory
    # (requests only) and ephemeral-storage. The memory limit is
    # codeInterpreter.memoryLimitMb, and a larger memory request is capped at it.
    # codeInterpreter.cpuTimeLimitSec does not affect execution pods. Set a value
    # to null to remove a default, e.g. limits.cpu: null for no CPU limit.
    # The CPU limit default of 5 keeps the limit that earlier versions derived
    # from cpuTimeLimitSec. Lower it (e.g. to "1") to pack pods densely.
    podResources:
      limits:
        cpu: "5"
      requests:
        cpu: "100m"
        memory: "64Mi"
    # Size limits of the /workspace and /tmp emptyDir volumes of execution pods.
    # Kubelet evicts a pod that writes more than the limit.
    workspaceSizeLimit: 100Mi
    tmpSizeLimit: 64Mi
    # Scheduling and metadata of execution pods. Use these to run user code on a
    # dedicated node pool, apart from the service and other workloads. The labels
    # "app" and "component" and the ownerReference belong to the service and
    # cannot be set here.
    pod:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      priorityClassName: ""
      # For example "gvisor" or "kata", to run user code in a sandboxed runtime.
      runtimeClassName: ""
      labels: {}
      annotations: {}

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Additional rules for the Role
  additionalRules: []

# ConfigMap for additional configuration
configMap:
  # Create a ConfigMap with additional configuration
  create: false
  # Additional environment variables from ConfigMap
  data: {}
    # CUSTOM_ENV: "value"

# Secret for sensitive configuration
secret:
  # Create a Secret with sensitive configuration
  create: false
  # Additional environment variables from Secret
  data: {}
    # API_KEY: "base64-encoded-value"

# Health check probes. /health (liveness) answers from memory and never calls
# the Kubernetes API, so a saturated or slow API server cannot get the pod
# restarted mid-run. /ready (readiness) runs a fresh executor backend check and
# returns 503 when the service cannot create executor pods.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Network Policy for the API-server (deployment) pod, configured by the fields
# below. Off by default; its defaults (deny-all ingress, DNS-only egress) are a
# starting point that most installs will need to customize before enabling.
#
# NOTE: this flag does NOT govern the executor/session pods. Those pods run user
# code and are ALWAYS given a deny-all-egress NetworkPolicy
# (templates/networkpolicy.yaml), independent of this setting.
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS
    - ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

# Extra environment variables
extraEnvVars: []
# - name: EXTRA_VAR
#   value: "extra-value"

# Extra environment variables from ConfigMaps or Secrets
extraEnvFrom: []
# - configMapRef:
#     name: my-configmap
# - secretRef:
#     name: my-secret

# Admission control. Each replica runs at most maxConcurrentExecutions
# executions at once (execute, execute/stream, session create, session bash).
# A request that cannot get a slot within queueTimeoutSec gets HTTP 429 with a
# Retry-After header. See HOW_IT_WORKS.md, "Capacity and overload".
capacity:
  maxConcurrentExecutions: 16
  queueTimeoutSec: 5
  # Retry-After (seconds) sent with 429 (this replica is busy).
  retryAfterSec: 2
  # Retry-After (seconds) sent with 503 (executor quota exhausted or executor
  # pod unschedulable).
  capacityRetryAfterSec: 10

# Optional ResourceQuota (and LimitRange) for the executor namespace. When the
# quota is exhausted, pod creation fails and the API returns HTTP 503 with
# Retry-After instead of a generic 500.
#
# The quota counts every pod in its namespace, and a cpu/memory quota rejects
# any pod there that does not set those requests/limits. Use a dedicated
# codeInterpreter.kubernetesExecutor.namespace. Rendering fails when the quota
# would land in the release namespace unless allowReleaseNamespace is true.
executorResourceQuota:
  enabled: false
  allowReleaseNamespace: false
  hard:
    pods: "32"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 12Gi
    # Executor pods set no ephemeral-storage requests or limits. A quota on
    # these keys rejects every such pod unless executorResourceQuota.limitRange
    # gives containers defaults.
    # requests.ephemeral-storage: 8Gi
    # limits.ephemeral-storage: 16Gi
  # Optional quota scopes, for example [NotBestEffort].
  scopes: []
  limitRange:
    enabled: false
    defaultRequest:
      ephemeral-storage: 64Mi
    default:
      ephemeral-storage: 256Mi

# Prometheus metrics are always served at /metrics on the http port.
metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, for example the label your Prometheus selects on.
    labels: {}

# Uploaded files and execution outputs are stored on the local disk of the
# replica that received them (FILE_STORAGE_DIR). The Onyx client uploads a file
# and then runs code in a separate request, so with more than one replica a
# run can land on a replica that does not have the file and fail with 404.
#
# The chart refuses to render replicaCount > 1 unless shared is true. Set it
# only after you mount shared storage (ReadWriteMany) at FILE_STORAGE_DIR on
# every replica, or route each client to one replica (sticky sessions).
fileStorage:
  shared: false
